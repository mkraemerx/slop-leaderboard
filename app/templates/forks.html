{% extends "base.html" %}
{% block title %}Forks{% endblock %}
{% block content %}
<h1>Forks</h1>

{% if root %}
  <p>Tracking root: <strong>{{ root.url }}</strong></p>
{% else %}
  <p class="empty">No root repository configured.</p>
{% endif %}

<form method="post" action="/forks" class="add-fork">
  <label>Add fork by URL:
    <input type="url" name="url" required placeholder="https://github.com/user/repo">
  </label>
  <button type="submit">Add</button>
</form>

{% include "_forks_table.html" %}
{% endblock %}
